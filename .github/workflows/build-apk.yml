name: Build APK

# Builds FreeMyTV.apk with build.sh. Run it by hand (Actions > Build APK > Run workflow) or push to the volume branch.
# No TMDB key goes in: the APK is public to anyone who can open the run. The signing key comes from the
# FREEMYTV_KEYSTORE_B64 repository secret (the Actions cache is only a fallback and expires).
on:
  workflow_dispatch:
  push:
    branches: [ccr-13d4b73c-qi4t5q]
    paths: ['app/**', 'build.sh', '.github/workflows/build-apk.yml']

permissions:
  contents: write   # to publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" >/dev/null
      - name: Settings
        run: |
          cp config.example.properties config.properties
          sed -i 's/^tmdb_region=.*/tmdb_region=MX/; s/^currency=.*/currency=MXN/; s/^temperature=.*/temperature=C/' config.properties
          sed -i 's#^catalog_url=.*#catalog_url=https://plugin.mangelcc.dev/catalog/series/animeflv-latest.json#' config.properties
      - name: Signing key from the repository secret (the same on every build, so an update installs over the previous one)
        env:
          KEYSTORE_B64: ${{ secrets.FREEMYTV_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > freemytv.keystore
            echo "Using the key from the FREEMYTV_KEYSTORE_B64 secret."
          else
            echo "No FREEMYTV_KEYSTORE_B64 secret: using the cached key, or making a new one."
          fi
      - name: Signing key cache (only without the secret; GitHub deletes a cache that goes 7 days unused)
        if: hashFiles('freemytv.keystore') == ''
        uses: actions/cache@v4
        with:
          path: freemytv.keystore
          key: signing-key-v1
      - run: ./build.sh
      - name: Certificate of this build (public, and the same on every build that installs over another)
        run: keytool -printcert -jarfile FreeMyTV.apk | grep -E 'SHA256'
      - name: Publish the APK as a release (a direct download, no zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest FreeMyTV.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" --notes "Built from $GITHUB_SHA. The signing key is kept between builds."
