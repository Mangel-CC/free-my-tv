name: Build APK

# Builds FreeMyTV.apk with build.sh. Run it by hand (Actions > Build APK > Run workflow) or push to the volume branch.
# No TMDB key goes in: the APK is public to anyone who can open the run. The signing key is kept in the Actions cache.
on:
  workflow_dispatch:
  push:
    branches: [ccr-13d4b73c-qi4t5q]
    paths: ['app/**', 'build.sh', '.github/workflows/build-apk.yml']

permissions:
  contents: write   # to publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" >/dev/null
      - name: Settings
        run: |
          cp config.example.properties config.properties
          sed -i 's/^tmdb_region=.*/tmdb_region=MX/; s/^currency=.*/currency=MXN/; s/^temperature=.*/temperature=C/' config.properties
          sed -i 's#^catalog_url=.*#catalog_url=https://plugin.mangelcc.dev/catalog/series/animeflv-latest.json#' config.properties
      - name: Signing key (kept between builds, so an update installs over the previous one)
        uses: actions/cache@v4
        with:
          path: freemytv.keystore
          key: signing-key-v1
      - run: ./build.sh
      - name: Publish the APK as a release (a direct download, no zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest FreeMyTV.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" --notes "Built from $GITHUB_SHA. The signing key is kept between builds."
